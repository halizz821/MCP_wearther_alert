[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "environment-canada-mcp"
version = "0.1.0"
description = "MCP Server for Environment Canada Weather Alerts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
environment-canada-mcp = "environment_canada_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["environment_canada_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]

